name: Publish registry image

on:
  push:
    tags:
      - registry-image-*
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable candidate image tag
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: deep-registry-api
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-protocol
          ref: ${{ github.ref_type == 'tag' && 'release-candidate/prod-20260909' || github.ref_name }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-protocol
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-client-shared
          ref: ${{ github.ref_type == 'tag' && 'release-candidate/prod-20260909' || github.ref_name }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-client-shared
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/xnode
          ref: ${{ github.ref_type == 'tag' && 'release-candidate/prod-20260909' || github.ref_name }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: xnode
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301
      - name: Test candidate
        working-directory: deep-registry-api
        run: dotnet test --configuration Release -p:DeepProtocolLocalCutover=true -p:DeepProtocolSourceCutover=true
      - name: Record protocol revision
        id: protocol
        shell: bash
        run: echo "sha=$(git -C deep-protocol rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: ./deep-registry-api
          file: ./deep-registry-api/Dockerfile
          build-contexts: |
            deep_protocol=./deep-protocol
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DEEP_PROTOCOL_REVISION=${{ steps.protocol.outputs.sha }}
          tags: ghcr.io/xpointlabs/deep-registry-api:${{ inputs.image_tag || github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/XPointLabs/deep-registry-api
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=deep-registry-api
          cache-to: type=gha,scope=deep-registry-api,mode=max
