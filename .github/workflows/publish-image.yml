name: Publish registry image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable candidate image tag
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: deep_s00
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: deep_s00
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deep_s00 -d deep_s00"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DEEP_TEST_DID2_ROUTE_POSTGRES: Host=127.0.0.1;Port=5432;Username=deep_s00;Password=isolated_ci_only;Database=deep_s00
      DEEP_TEST_DID2_GRANT_POSTGRES: Host=127.0.0.1;Port=5432;Username=deep_s00;Password=isolated_ci_only;Database=deep_s00
      DEEP_TEST_DID2_FLOOR_POSTGRES: Host=127.0.0.1;Port=5432;Username=deep_s00;Password=isolated_ci_only;Database=deep_s00
    steps:
      - uses: actions/checkout@v4
        with:
          path: deep-registry-api
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-protocol
          ref: ${{ github.ref_name }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-protocol
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-client-shared
          ref: ${{ github.ref_name }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-client-shared
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/xnode
          ref: ${{ github.ref_name }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: xnode
      # Source-bound observer is outside the exact-three .NET Protocol graph.
      # Packaging it does not enable automatic time or provision a floor.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-devops
          ref: ${{ github.ref_name }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-devops
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301
      - name: Test candidate
        working-directory: deep-registry-api
        run: dotnet test --configuration Release -m:1 -p:DeepProtocolLocalCutover=true -p:DeepProtocolSourceCutover=true
      - name: Record protocol revision
        id: protocol
        shell: bash
        run: |
          echo "sha=$(git -C deep-protocol rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "devops_sha=$(git -C deep-devops rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Match the existing candidate publisher's package credential.
          password: ${{ secrets.XPOINTLABS_CI_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./deep-registry-api
          file: ./deep-registry-api/Dockerfile
          build-contexts: |
            deep_protocol=./deep-protocol
            deep_devops=./deep-devops
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DEEP_PROTOCOL_REVISION=${{ steps.protocol.outputs.sha }}
            DEEP_DEVOPS_REVISION=${{ steps.protocol.outputs.devops_sha }}
          tags: ghcr.io/xpointlabs/deep-registry-api:${{ inputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/XPointLabs/deep-registry-api
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=deep-registry-api
          cache-to: type=gha,scope=deep-registry-api,mode=max
