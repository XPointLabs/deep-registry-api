name: Registry API Build And Test

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: deep-registry-api

      - name: Checkout protocol
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-protocol
          ref: ${{ github.ref_name }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN }}
          path: deep-protocol

      - name: Checkout shared client
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-client-shared
          ref: ${{ github.ref_name }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN }}
          path: deep-client-shared

      - name: Checkout xnode
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/xnode
          ref: ${{ github.ref_name }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN }}
          path: xnode

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301

      - name: Restore
        working-directory: deep-registry-api
        run: dotnet restore -p:DeepProtocolLocalCutover=true -p:DeepProtocolSourceCutover=true

      - name: Build
        working-directory: deep-registry-api
        run: dotnet build --no-restore --configuration Release -p:DeepProtocolLocalCutover=true -p:DeepProtocolSourceCutover=true

      - name: Test
        working-directory: deep-registry-api
        run: dotnet test --no-build --configuration Release -p:DeepProtocolLocalCutover=true -p:DeepProtocolSourceCutover=true

  publish-candidate:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-candidate/')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: deep-registry-api
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-protocol
          ref: ${{ github.ref_name }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-protocol
      - name: Record protocol revision
        id: protocol
        run: echo "sha=$(git -C deep-protocol rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: ./deep-registry-api
          file: ./deep-registry-api/Dockerfile
          build-contexts: |
            deep_protocol=./deep-protocol
          platforms: linux/amd64
          push: true
          build-args: |
            DEEP_PROTOCOL_REVISION=${{ steps.protocol.outputs.sha }}
          tags: ghcr.io/xpointlabs/deep-registry-api:rc-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/XPointLabs/deep-registry-api
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=deep-registry-api
          cache-to: type=gha,scope=deep-registry-api,mode=max
