name: Registry API Build And Test

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    # Disposable CI database only; each durable test owns a random schema.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: deep_s00
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_DB: deep_s00
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deep_s00 -d deep_s00"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Synthetic disposable CI auth only; no password in logged connection strings.
      PGPASSWORD: isolated_ci_only
      DEEP_TEST_DID2_ROUTE_POSTGRES: Host=127.0.0.1;Port=5432;Username=deep_s00;Database=deep_s00
      DEEP_TEST_DID2_GRANT_POSTGRES: Host=127.0.0.1;Port=5432;Username=deep_s00;Database=deep_s00
      DEEP_TEST_DID2_FLOOR_POSTGRES: Host=127.0.0.1;Port=5432;Username=deep_s00;Database=deep_s00

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: deep-registry-api

      - name: Checkout protocol
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-protocol
          ref: ${{ github.ref_name }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN }}
          path: deep-protocol

      - name: Checkout shared client
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-client-shared
          ref: ${{ github.ref_name }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN }}
          path: deep-client-shared

      - name: Checkout xnode
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/xnode
          ref: ${{ github.ref_name }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN }}
          path: xnode

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301

      - name: Restore
        working-directory: deep-registry-api
        run: dotnet restore -p:DeepProtocolLocalCutover=true -p:DeepProtocolSourceCutover=true

      - name: Build
        working-directory: deep-registry-api
        run: dotnet build --no-restore --configuration Release -m:1 -p:DeepProtocolLocalCutover=true -p:DeepProtocolSourceCutover=true

      - name: Test
        working-directory: deep-registry-api
        run: dotnet test --no-build --configuration Release -p:DeepProtocolLocalCutover=true -p:DeepProtocolSourceCutover=true

  publish-candidate:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-candidate/')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: deep-registry-api
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-protocol
          ref: ${{ github.ref_name }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-protocol
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-devops
          ref: ${{ github.ref_name }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-devops
      - name: Record protocol revision
        id: protocol
        run: |
          echo "sha=$(git -C deep-protocol rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "devops_sha=$(git -C deep-devops rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.XPOINTLABS_CI_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./deep-registry-api
          file: ./deep-registry-api/Dockerfile
          build-contexts: |
            deep_protocol=./deep-protocol
            deep_devops=./deep-devops
          platforms: linux/amd64
          push: true
          build-args: |
            DEEP_PROTOCOL_REVISION=${{ steps.protocol.outputs.sha }}
            DEEP_DEVOPS_REVISION=${{ steps.protocol.outputs.devops_sha }}
          tags: ghcr.io/xpointlabs/deep-registry-api:rc-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/XPointLabs/deep-registry-api
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=deep-registry-api
          cache-to: type=gha,scope=deep-registry-api,mode=max
