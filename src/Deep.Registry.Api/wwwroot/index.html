<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deep Registry</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #5b6573;
      --line: #d7dde5;
      --fill: #f6f8fb;
      --accent: #0f766e;
      --accent-strong: #115e59;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      background: #ffffff;
      color: var(--ink);
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px;
    }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 18px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      color: var(--muted);
    }
    section {
      margin-top: 22px;
      display: grid;
      grid-template-columns: minmax(320px, 420px) 1fr;
      gap: 20px;
      align-items: start;
    }
    form, .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      background: var(--fill);
    }
    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      font-weight: 650;
      margin-bottom: 12px;
    }
    input {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      font: inherit;
      background: #fff;
    }
    button {
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      height: 40px;
      padding: 0 14px;
      font-weight: 750;
      cursor: pointer;
    }
    button:hover {
      background: var(--accent-strong);
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.45;
    }
    @media (max-width: 840px) {
      main {
        padding: 18px;
      }
      header, section {
        display: block;
      }
      .panel {
        margin-top: 16px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Deep Registry</h1>
        <p>XPoint node registration, VLESS transport metadata, and stake-state lookup.</p>
      </div>
      <button id="refresh" type="button">Refresh</button>
    </header>
    <section>
      <form id="register">
        <label>Node ID<input name="nodeId" value="node-local-1"></label>
        <label>Operator Address<input name="operatorAddress" value="0x1111111111111111111111111111111111111111"></label>
        <label>Rewards Address<input name="rewardsAddress" value="0x1111111111111111111111111111111111111111"></label>
        <label>BLS X<input name="blsX" value="0x01"></label>
        <label>BLS Y<input name="blsY" value="0x02"></label>
        <label>VLESS Host<input name="host" value="127.0.0.1"></label>
        <label>VLESS Port<input name="port" type="number" value="443"></label>
        <label>VLESS UUID<input name="uuid" value="00000000-0000-4000-8000-000000000001"></label>
        <button type="submit">Register Node</button>
      </form>
      <div class="panel">
        <pre id="output">[]</pre>
      </div>
    </section>
  </main>
  <script>
    const output = document.querySelector("#output");

    async function refresh() {
      const response = await fetch("/api/nodes");
      output.textContent = JSON.stringify(await response.json(), null, 2);
    }

    document.querySelector("#refresh").addEventListener("click", refresh);
    document.querySelector("#register").addEventListener("submit", async event => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      await fetch("/api/nodes/register", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          nodeId: form.get("nodeId"),
          operatorAddress: form.get("operatorAddress"),
          rewardsAddress: form.get("rewardsAddress"),
          blsPublicKey: { x: form.get("blsX"), y: form.get("blsY") },
          ed25519PublicKey: "00",
          operatorFeeBps: 0,
          stakeAtomic: 25000000000000,
          transport: {
            protocol: "vless",
            host: form.get("host"),
            port: Number(form.get("port")),
            uuid: form.get("uuid"),
            security: "reality",
            sni: form.get("host")
          }
        })
      });
      await refresh();
    });

    refresh();
  </script>
</body>
</html>
